<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title description">
  <title id="title">SOUL mark</title>
  <desc id="description">A luminous core surrounded by four connected orbital nodes.</desc>
  <defs>
    <linearGradient id="surface" x1="20" y1="16" x2="140" y2="144" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="signal" x1="38" y1="30" x2="126" y2="132" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.52" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(70 62) rotate(48) scale(58)">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.22" stop-color="#CFFAFE"/>
      <stop offset="0.58" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="144" height="144" rx="38" fill="url(#surface)"/>
  <rect x="8.75" y="8.75" width="142.5" height="142.5" rx="37.25" fill="none" stroke="#334155" stroke-width="1.5"/>
  <g fill="none" stroke="url(#signal)" stroke-linecap="round">
    <path d="M39 53C49 31 73 20 96 27C119 34 135 56 131 80" stroke-width="4" opacity=".9"/>
    <path d="M121 108C105 131 73 139 49 123C27 108 20 79 34 57" stroke-width="4" opacity=".72"/>
    <path d="M47 114C72 105 91 88 101 61" stroke-width="3" opacity=".48"/>
  </g>
  <g fill="#E0F2FE" stroke="#0F172A" stroke-width="4">
    <circle cx="36" cy="53" r="8"/>
    <circle cx="103" cy="29" r="7"/>
    <circle cx="130" cy="86" r="9"/>
    <circle cx="45" cy="121" r="7"/>
  </g>
  <circle cx="79" cy="79" r="29" fill="url(#core)" filter="url(#glow)"/>
  <path d="M68 67C73 61 87 61 93 68C97 73 95 79 88 82L75 87C69 89 68 96 74 99C80 102 91 100 96 94" fill="none" stroke="#0F172A" stroke-width="7" stroke-linecap="round"/>
</svg>
